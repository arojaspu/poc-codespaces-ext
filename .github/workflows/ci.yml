name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
          pip install -e ./tools

      - name: Lint
        run: ruff check src tools tests

      - name: Tests
        run: pytest -q

      # Control L4: la politica no se puede desincronizar en un PR.
      - name: Drift de politica (allowlist.yaml vs devcontainer.json)
        run: python -m ext_guard drift
